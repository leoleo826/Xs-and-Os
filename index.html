<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>〇×ゲーム</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <h1>〇×ゲーム</h1>
    <p id="status">プレイヤー O の番です</p>

    <div id="board" class="board" role="grid" aria-label="3x3 の盤">
      <button class="cell" data-index="0" aria-label="セル 1"></button>
      <button class="cell" data-index="1" aria-label="セル 2"></button>
      <button class="cell" data-index="2" aria-label="セル 3"></button>
      <button class="cell" data-index="3" aria-label="セル 4"></button>
      <button class="cell" data-index="4" aria-label="セル 5"></button>
      <button class="cell" data-index="5" aria-label="セル 6"></button>
      <button class="cell" data-index="6" aria-label="セル 7"></button>
      <button class="cell" data-index="7" aria-label="セル 8"></button>
      <button class="cell" data-index="8" aria-label="セル 9"></button>
    </div>

    <div class="controls">
      <button id="reset">リセット</button>
    </div>

    <p class="notes">ルール: 先に縦・横・斜めに3つ並べた方が勝ち。もし同じユーザーが4つ目を入力して勝利に至らない場合、そのユーザーの最初の入力が消えます。</p>
  </main>

  <script src="/script.js"></script>
</body>
</html>
