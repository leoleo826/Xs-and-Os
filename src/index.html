<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>〇×ゲーム</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="game">
    <h1>〇×ゲーム</h1>

    <div class="mode-switch" aria-label="対戦モード選択">
      <button class="mode-btn active" data-mode="pvp" type="button">2人対戦</button>
      <button class="mode-btn" data-mode="cpu" type="button">CPU対戦</button>
    </div>

    <div class="toolbar" aria-label="設定">
      <div class="field">
        <label for="difficulty">難易度</label>
        <select id="difficulty" aria-label="難易度">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="field">
        <label for="start-player">先攻</label>
        <select id="start-player" aria-label="先攻選択">
          <option value="O" selected>O</option>
          <option value="X">X</option>
        </select>
      </div>

      <div id="cpu-mark-container" class="field hidden">
        <label for="human-mark">あなたのマーク</label>
        <select id="human-mark" aria-label="あなたのマーク選択">
          <option value="X" selected>X</option>
          <option value="O">O</option>
        </select>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score-box">
        <span>O勝</span>
        <strong id="score-o">0</strong>
      </div>
      <div class="score-box">
        <span>X勝</span>
        <strong id="score-x">0</strong>
      </div>
      <div class="score-box">
        <span>引き分け</span>
        <strong id="score-draw">0</strong>
      </div>
    </div>

    <div class="history-panel">
      <h2>勝敗履歴</h2>
      <ul id="history-list"></ul>
    </div>

    <p id="status" class="status" role="status" aria-live="polite">プレイヤー O の番です</p>

    <div id="board" class="board" role="grid" aria-label="3×3のマス">
      <button class="cell" data-index="0" aria-label="1つ目のマス" type="button"></button>
      <button class="cell" data-index="1" aria-label="2つ目のマス" type="button"></button>
      <button class="cell" data-index="2" aria-label="3つ目のマス" type="button"></button>
      <button class="cell" data-index="3" aria-label="4つ目のマス" type="button"></button>
      <button class="cell" data-index="4" aria-label="5つ目のマス" type="button"></button>
      <button class="cell" data-index="5" aria-label="6つ目のマス" type="button"></button>
      <button class="cell" data-index="6" aria-label="7つ目のマス" type="button"></button>
      <button class="cell" data-index="7" aria-label="8つ目のマス" type="button"></button>
      <button class="cell" data-index="8" aria-label="9つ目のマス" type="button"></button>
    </div>

    <button id="reset" class="reset-btn" type="button">リセット</button>
  </main>

  <script src="./script.js"></script>
</body>
</html>
